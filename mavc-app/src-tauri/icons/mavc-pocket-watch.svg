  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#60471f"/><stop offset=".28" stop-color="#d0ad4e"/>
      <stop offset=".48" stop-color="#73551f"/><stop offset=".67" stop-color="#e0c46b"/><stop offset="1" stop-color="#60471f"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#694e21"/><stop offset=".35" stop-color="#d0ad4e"/>
      <stop offset=".7" stop-color="#61471d"/><stop offset="1" stop-color="#c59d42"/>
