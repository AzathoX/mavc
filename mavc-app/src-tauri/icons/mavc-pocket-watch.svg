    <radialGradient id="face" cx="45%" cy="36%" r="70%">
      <stop stop-color="#20212a"/><stop offset=".58" stop-color="#151720"/><stop offset="1" stop-color="#0d0f16"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
