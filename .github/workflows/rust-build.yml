name: Rust Build and Export

# 触发条件：当推送到 main 分支，或者手动触发
on:
  push:
    branches: [ "build" ]
  workflow_dispatch: # 允许你在 GitHub 页面上手动点击按钮触发编译

jobs:
  build:
    name: Build Rust Binary (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    # 1. 拉取你的代码
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 设置 Rust 环境（GitHub 官方提供的 Action 会自动安装最新版 Rust 和 Cargo）
    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    # 3. 开启 Rust 编译缓存，这能让以后每次编译速度提升 5 倍以上
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    # ALSA headers are needed by the audio output dependency on Linux.
    - name: Install Linux audio dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install --yes pkg-config libasound2-dev

    # 4. 执行编译命令（Release 优化版本）
    - name: Run Cargo Build
      run: cargo build --release

    # 5. 上传编译好的二进制文件到 GitHub，作为下载产物 (Artifact)
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rust-release-binary-${{ matrix.os }}
        path: |
          target/release/mavc
          target/release/mavc.exe
        retention-days: 7
