name: Rust Build and Export

# Build on branch pushes, manual runs, or a Release published through GitHub.
on:
  push:
    branches: [ "build" ]
  workflow_dispatch: # 允许你在 GitHub 页面上手动点击按钮触发编译
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build MAVC (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    # 1. 拉取你的代码
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 设置 Rust 环境（GitHub 官方提供的 Action 会自动安装最新版 Rust 和 Cargo）
    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    # 3. 开启 Rust 编译缓存，这能让以后每次编译速度提升 5 倍以上
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          mavc -> target
          mavc-app -> target

    # Install the native libraries required by the Tauri and audio dependencies on Linux.
    - name: Install Linux build dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install --yes \
          build-essential \
          curl \
          file \
          libasound2-dev \
          libayatana-appindicator3-dev \
          libgtk-3-dev \
          libssl-dev \
          libwebkit2gtk-4.1-dev \
          libxdo-dev \
          librsvg2-dev \
          lld \
          pkg-config \
          patchelf \
          wget

    # Build the CLI crate from its own project directory.
    - name: Build MAVC CLI
      run: cargo build --release
      working-directory: mavc

    # Install the CLIs used by mavc-app's Tauri beforeBuildCommand and build command.
    - name: Install Dioxus CLI
      run: cargo install dioxus-cli --version "~0.7" --locked

    - name: Install Tauri CLI
      run: cargo install tauri-cli --version "^2.0.0" --locked

    # Fetch dependencies and create Cargo.lock if this checkout has none.
    - name: Fetch macOS app dependencies
      if: runner.os == 'macOS'
      run: cargo fetch
      working-directory: mavc-app

    - name: Bundle macOS frontend
      if: runner.os == 'macOS'
      run: dx bundle --release
      working-directory: mavc-app

    # The frontend is already bundled above; disable the duplicate build hook.
    - name: Package MAVC for macOS
      if: runner.os == 'macOS'
      run: |
        test -f dist/public/index.html
        cargo tauri build --config '{"build":{"beforeBuildCommand":""}}' --bundles app --ci -- --offline
        test -f target/release/bundle/macos/malbum.app/Contents/Info.plist
        test -x target/release/bundle/macos/malbum.app/Contents/MacOS/mavc-app
        codesign --verify --deep --strict --verbose=2 target/release/bundle/macos/malbum.app
      working-directory: mavc-app

    - name: Archive malbum macOS App
      if: runner.os == 'macOS'
      run: |
        ditto -c -k --sequesterRsrc --keepParent target/release/bundle/macos/malbum.app target/release/bundle/macos/malbum-macos.zip
        unzip -t target/release/bundle/macos/malbum-macos.zip
        verification_dir="$(mktemp -d)"
        ditto -x -k target/release/bundle/macos/malbum-macos.zip "$verification_dir"
        codesign --verify --deep --strict --verbose=2 "$verification_dir/malbum.app"
        rm -rf "$verification_dir"
      working-directory: mavc-app

    # Linux and Windows currently export their native app binaries without installers.
    - name: Build MAVC Desktop App
      if: runner.os != 'macOS'
      run: cargo tauri build --no-bundle
      working-directory: mavc-app

    # Upload the CLI and desktop app binaries as a per-platform artifact.
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mavc-${{ matrix.os }}
        path: |
          mavc/target/release/mavc
          mavc/target/release/mavc.exe
          mavc-app/target/release/mavc-app
          mavc-app/target/release/mavc-app.exe
        retention-days: 7

    - name: Prepare macOS Release assets
      if: github.event_name == 'release' && runner.os == 'macOS'
      shell: bash
      run: |
        mkdir -p release-assets
        cp mavc-app/target/release/bundle/macos/malbum-macos.zip "release-assets/malbum-macos-${RUNNER_ARCH}.zip"
        tar -czf "release-assets/mavc-cli-macos-${RUNNER_ARCH}.tar.gz" -C mavc/target/release mavc

    - name: Prepare Ubuntu Release assets
      if: github.event_name == 'release' && runner.os == 'Linux'
      shell: bash
      run: |
        mkdir -p release-assets linux-package
        cp mavc/target/release/mavc linux-package/mavc
        cp mavc-app/target/release/mavc-app linux-package/malbum
        tar -czf "release-assets/malbum-ubuntu-${RUNNER_ARCH}.tar.gz" -C linux-package malbum mavc

    - name: Prepare Windows Release assets
      if: github.event_name == 'release' && runner.os == 'Windows'
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force release-assets, windows-package | Out-Null
        Copy-Item mavc/target/release/mavc.exe windows-package/mavc.exe
        Copy-Item mavc-app/target/release/mavc-app.exe windows-package/malbum.exe
        Compress-Archive -Path windows-package/* -DestinationPath "release-assets/malbum-windows-$env:RUNNER_ARCH.zip" -Force

    # Attach directly to the existing published Release; no local download needed.
    - name: Upload assets to GitHub Release
      if: github.event_name == 'release'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: gh release upload "$RELEASE_TAG" release-assets/* --clobber

    # Preserve the complete macOS bundle directory before post-job cache cleanup.
    # Keep the ditto ZIP inside it to preserve app permissions and macOS metadata.
    - name: Upload complete macOS bundle directory
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: malbum-macos-app
        path: mavc-app/target/release/bundle/macos/
        if-no-files-found: error
        retention-days: 7
