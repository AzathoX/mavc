name: Rust Build and Export

# 触发条件：当推送到 main 分支，或者手动触发
on:
  push:
    branches: [ "build" ]
  workflow_dispatch: # 允许你在 GitHub 页面上手动点击按钮触发编译

jobs:
  build:
    name: Build MAVC (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    # 1. 拉取你的代码
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 设置 Rust 环境（GitHub 官方提供的 Action 会自动安装最新版 Rust 和 Cargo）
    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    # 3. 开启 Rust 编译缓存，这能让以后每次编译速度提升 5 倍以上
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    # Install the native libraries required by the Tauri and audio dependencies on Linux.
    - name: Install Linux build dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install --yes \
          build-essential \
          curl \
          file \
          libasound2-dev \
          libayatana-appindicator3-dev \
          libgtk-3-dev \
          libssl-dev \
          libwebkit2gtk-4.1-dev \
          libxdo-dev \
          librsvg2-dev \
          lld \
          pkg-config \
          patchelf \
          wget

    # Build the CLI crate from its own project directory.
    - name: Build MAVC CLI
      run: cargo build --release
      working-directory: mavc

    # Install the CLIs used by mavc-app's Tauri beforeBuildCommand and build command.
    - name: Install Dioxus CLI
      run: cargo install dioxus-cli --locked

    - name: Install Tauri CLI
      run: cargo install tauri-cli --version "^2.0.0" --locked

    # Build the desktop app from its own project directory, including the Dioxus frontend.
    - name: Build MAVC Desktop App
      run: cargo tauri build --no-bundle
      working-directory: mavc-app

    # Upload the CLI and desktop app binaries as a per-platform artifact.
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mavc-binaries-${{ matrix.os }}
        path: |
          mavc/target/release/mavc
          mavc/target/release/mavc.exe
          mavc-app/target/release/mavc-app
          mavc-app/target/release/mavc-app.exe
        retention-days: 7
