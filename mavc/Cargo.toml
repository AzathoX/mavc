[package]
name = "mavc"
version = "0.5.0"
edition = "2024"
description = "Create and inspect weighted-playlist MAVC music archives"
license = "Apache-2.0"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
lofty = "0.25.4"
rand = "0.8"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "symphonia-flac", "symphonia-mp3", "symphonia-aac", "symphonia-isomp4", "symphonia-wav", "symphonia-pcm", "symphonia-ogg", "symphonia-vorbis"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "flac", "aac", "isomp4", "wav", "pcm", "ogg", "vorbis"] }
