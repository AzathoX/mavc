[package]
name = "mavc"
version = "0.1.0"
edition = "2024"
description = "Create and inspect weighted-playlist MAVC music archives"
license = "Apache-2.0"

[dependencies]
lofty = "0.25.4"
rand = "0.8"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "symphonia-flac", "symphonia-mp3", "symphonia-aac", "symphonia-isomp4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
